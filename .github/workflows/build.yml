name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JarvisHome.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JarvisHome
          path: JarvisHome.apk

      # A public release gives a short, permanent download link the TV can fetch:
      # https://github.com/<you>/<repo>/releases/latest/download/JarvisHome.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis Home build ${{ github.run_number }}
          files: JarvisHome.apk
          make_latest: true
